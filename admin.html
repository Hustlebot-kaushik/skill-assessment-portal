<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Skill Assessment Portal</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'Noto Sans', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Supabase JS Client v2 via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>

<body class="bg-gray-50 text-gray-900 min-h-screen font-sans antialiased">
  
  <!-- ======================== HEADER ======================== -->
  <header class="bg-gray-900 text-white shadow-md" role="banner">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <h1 class="text-lg font-bold leading-tight">Assessment Portal Admin</h1>
      </div>
      <div id="auth-controls" class="hidden">
        <span id="current-user" class="mr-4 text-sm text-gray-300"></span>
        <button id="btn-logout" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm transition-colors">
          Log Out
        </button>
      </div>
    </div>
  </header>

  <!-- ======================== LOGIN SCREEN ======================== -->
  <main id="screen-login" class="screen active max-w-md mx-auto px-4 py-16">
    <div class="bg-white rounded-2xl shadow-lg p-8">
      <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Staff Login</h2>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
          <input type="email" id="login-email" required class="w-full border border-gray-300 rounded px-3 py-2" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
          <input type="password" id="login-password" required class="w-full border border-gray-300 rounded px-3 py-2" />
        </div>
        <p id="login-error" class="text-red-600 text-sm hidden"></p>
        <button type="submit" id="btn-login" class="w-full bg-blue-600 text-white font-semibold rounded py-2 hover:bg-blue-700 transition-colors">
          Sign In
        </button>
      </form>
    </div>
  </main>

  <!-- ======================== MAIN ADMIN LAYOUT ======================== -->
  <div id="screen-admin" class="screen hidden">
    <div class="max-w-7xl mx-auto px-4 py-6">
      
      <!-- Tabs -->
      <div class="border-b border-gray-200 mb-6 flex gap-4">
        <button class="tab-btn active" data-tab="dashboard">Submissions Dashboard</button>
        <button class="tab-btn" data-tab="questions">Question Manager</button>
      </div>

      <!-- DASHBOARD TAB -->
      <section id="tab-dashboard" class="tab-content active">
        <div class="bg-white rounded-xl shadow p-6 mb-6">
          <div class="flex flex-wrap gap-4 items-end mb-6">
            <div class="flex-1 min-w-[200px]">
              <label class="block text-sm font-semibold text-gray-700 mb-1">Search Name</label>
              <input type="text" id="filter-name" placeholder="Search..." class="w-full border border-gray-300 rounded px-3 py-2 text-sm" />
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1">Level</label>
              <select id="filter-level" class="border border-gray-300 rounded px-3 py-2 text-sm">
                <option value="">All Levels</option>
                <option value="primary">Primary</option>
                <option value="middle">Middle</option>
                <option value="secondary">Secondary</option>
                <option value="higher">Higher</option>
                <option value="graduate">Graduate</option>
              </select>
            </div>
            <div>
              <button id="btn-refresh-dashboard" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded text-sm font-medium transition-colors">Refresh</button>
              <button id="btn-export-csv" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded text-sm font-medium transition-colors ml-2">Export CSV</button>
            </div>
          </div>
          
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm whitespace-nowrap">
              <thead class="bg-gray-50 text-gray-700 border-b">
                <tr>
                  <th class="p-3 font-semibold">Date</th>
                  <th class="p-3 font-semibold">Name</th>
                  <th class="p-3 font-semibold">Level</th>
                  <th class="p-3 font-semibold">Category</th>
                  <th class="p-3 font-semibold">Score</th>
                  <th class="p-3 font-semibold">Pathway</th>
                </tr>
              </thead>
              <tbody id="dashboard-tbody" class="divide-y divide-gray-100">
                <!-- Data injected here -->
              </tbody>
            </table>
          </div>
          <div id="dashboard-status" class="mt-4 text-sm text-gray-500 text-center">Loading...</div>
        </div>
      </section>

      <!-- QUESTIONS TAB -->
      <section id="tab-questions" class="tab-content hidden">
        <div class="bg-white rounded-xl shadow p-6">
          <div class="flex justify-between items-center mb-6">
            <div class="flex gap-4 items-center">
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Level</label>
                <select id="qfilter-level" class="border border-gray-300 rounded px-3 py-2 text-sm">
                  <option value="primary">Primary</option>
                  <option value="middle">Middle</option>
                  <option value="secondary">Secondary</option>
                  <option value="higher">Higher</option>
                  <option value="graduate">Graduate</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Section</label>
                <select id="qfilter-section" class="border border-gray-300 rounded px-3 py-2 text-sm">
                  <option value="Basic Computers">Basic Computers</option>
                  <option value="English">English</option>
                  <option value="Logical Reasoning">Logical Reasoning</option>
                  <option value="Aptitude">Aptitude</option>
                </select>
              </div>
            </div>
            <button id="btn-add-question" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm font-medium transition-colors">
              + Add Question
            </button>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead class="bg-gray-50 text-gray-700 border-b">
                <tr>
                  <th class="p-3 font-semibold w-1/2">Question</th>
                  <th class="p-3 font-semibold">Options / Correct</th>
                  <th class="p-3 font-semibold text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="questions-tbody" class="divide-y divide-gray-100">
                <!-- Data injected here -->
              </tbody>
            </table>
          </div>
          <div id="questions-status" class="mt-4 text-sm text-gray-500 text-center">Loading...</div>
        </div>
      </section>
    </div>
  </div>

  <!-- QUESTION MODAL -->
  <div id="question-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg p-6">
      <h3 id="modal-title" class="text-xl font-bold mb-4">Add Question</h3>
      <form id="question-form" class="space-y-4">
        <input type="hidden" id="modal-id" />
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Level</label>
            <select id="modal-level" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
              <option value="primary">Primary</option>
              <option value="middle">Middle</option>
              <option value="secondary">Secondary</option>
              <option value="higher">Higher</option>
              <option value="graduate">Graduate</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Section</label>
            <select id="modal-section" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
              <option value="Basic Computers">Basic Computers</option>
              <option value="English">English</option>
              <option value="Logical Reasoning">Logical Reasoning</option>
              <option value="Aptitude">Aptitude</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Question Text</label>
          <textarea id="modal-question" required rows="2" class="w-full border border-gray-300 rounded px-3 py-2 text-sm"></textarea>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Options &amp; Correct Answer</label>
          <div class="space-y-2" id="modal-options">
            <div class="flex items-center gap-2">
              <input type="radio" name="modal-correct" value="0" required checked class="w-4 h-4 text-blue-600" />
              <input type="text" class="modal-opt w-full border border-gray-300 rounded px-3 py-1 text-sm" placeholder="Option 1" required />
            </div>
            <div class="flex items-center gap-2">
              <input type="radio" name="modal-correct" value="1" required class="w-4 h-4 text-blue-600" />
              <input type="text" class="modal-opt w-full border border-gray-300 rounded px-3 py-1 text-sm" placeholder="Option 2" required />
            </div>
            <div class="flex items-center gap-2">
              <input type="radio" name="modal-correct" value="2" required class="w-4 h-4 text-blue-600" />
              <input type="text" class="modal-opt w-full border border-gray-300 rounded px-3 py-1 text-sm" placeholder="Option 3" required />
            </div>
            <div class="flex items-center gap-2">
              <input type="radio" name="modal-correct" value="3" required class="w-4 h-4 text-blue-600" />
              <input type="text" class="modal-opt w-full border border-gray-300 rounded px-3 py-1 text-sm" placeholder="Option 4" required />
            </div>
          </div>
        </div>
        <div class="flex justify-end gap-3 mt-6">
          <button type="button" id="btn-modal-cancel" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded text-sm font-medium transition-colors">Cancel</button>
          <button type="submit" id="btn-modal-save" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm font-medium transition-colors">Save Question</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/admin/auth.js"></script>
  <script src="js/admin/dashboard.js"></script>
  <script src="js/admin/questions-manager.js"></script>
  <script src="js/admin/admin-app.js"></script>
</body>
</html>
